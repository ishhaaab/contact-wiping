[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "contact-wiping"
version = "0.1.0"
description = "Simulation-first contact-aware wiping with scripted demonstrations, BC, and PPO"
requires-python = ">=3.11,<3.12"
dependencies = [
  "mujoco>=3.3,<4",
  "gymnasium>=1.2,<2",
  "numpy>=2,<3",
  "torch>=2.8,<3",
  "stable-baselines3>=2.7,<3",
  "h5py>=3.14,<4",
  "matplotlib>=3.10,<4",
  "imageio>=2.37,<3",
  "imageio-ffmpeg>=0.6,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
wiping = "wiping.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
